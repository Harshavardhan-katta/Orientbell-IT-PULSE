<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add User</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="header">
        <h1>OBL IT-PULSE</h1>
    </div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-toggle" id="toggleBtn">☰</div>
        <a href="admin_dashboard.html">Dashboard</a>
        <a href="analytics.html">Analytics</a>
        <a href="tech_performance.html">Technician Performance</a>
        <a href="reports.html">Reports</a>
        <a href="add_user.html" class="active">Manage  User</a>
        <a href="#" id="logout">Logout</a>
    </div>
    <div class="main">
        <h1>Add User (Employee, Technician)</h1>
        <form id="addForm">
            <input type="text" id="userid" placeholder="User ID" required><br>
            <input type="text" id="name" placeholder="Name" required><br>
            <select id="role">
                <option value="Employee">Employee</option>
                <option value="Technician">Technician</option>
                <option value="Admin">Admin</option>
            </select><br>
            <select id="techCategory" style="display:none;">
                <option value="">-- select category --</option>
                <option value="ERP">ERP</option>
                <option value="Hardware">Hardware</option>
                <option value="Network">Network</option>
                <option value="Software">Software</option>
            </select><br>
            <input type="text" id="department" placeholder="Department"><br>
            <input type="password" id="password" placeholder="Password" required><br>
            <button type="submit">Create</button>
        </form>
        <div id="msg"></div>

        <hr />
        <div id="userTables">
            <h2>Employees</h2>
            <table id="empTable"><thead><tr><th>ID</th><th>Name</th><th>Password</th><th>Action</th></tr></thead><tbody></tbody></table>
            <h2>Technicians</h2>
            <table id="techTable"><thead><tr><th>ID</th><th>Name</th><th>Password</th><th>Category</th><th>Action</th></tr></thead><tbody></tbody></table>
         </div>
    </div>
    <script>
    // ensure admin user
    const tokenVal = localStorage.getItem('token');
    const roleVal = localStorage.getItem('role');
    if (!tokenVal || roleVal !== 'Admin') {
        window.location.href = 'login.html';
    }
    const roleEl = document.getElementById('role');
    const catEl = document.getElementById('techCategory');
    const deptEl = document.getElementById('department');
    roleEl.addEventListener('change', ()=>{
        if (roleEl.value === 'Technician') {
            catEl.style.display = 'block';
            deptEl.value = 'IT';
        } else {
            catEl.style.display = 'none';
        }
    });

    document.getElementById('addForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const userid=document.getElementById('userid').value;
        const name=document.getElementById('name').value;
        const role=document.getElementById('role').value;
        const department=document.getElementById('department').value;
        const password=document.getElementById('password').value;
        const category = catEl.value;
        if (role === 'Technician' && !category) {
            document.getElementById('msg').textContent = 'Please select a category for the technician';
            return;
        }
        const token = localStorage.getItem('token');
        const res = await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json', Authorization: token},body:JSON.stringify({userid,name,role,department,password,category})});
        const data=await res.json();
        document.getElementById('msg').textContent=data.message;
        if (res.ok) loadUsers();
    });

    async function loadUsers() {
        const token = localStorage.getItem('token');
        const res = await fetch('/api/auth/users', { headers: { Authorization: token } });
        if (!res.ok) return;
        const list = await res.json();
        const empT = document.querySelector('#empTable tbody');
        const techT = document.querySelector('#techTable tbody');
        if (empT) empT.innerHTML = '';
        if (techT) techT.innerHTML = '';
        list.forEach(u => {
            const tr = document.createElement('tr');
            if (u.role === 'Employee') {
                tr.innerHTML = `<td>${u.userid}</td><td>${u.name}</td><td>${u.password}</td><td><button class="del" data-id="${u.userid}">Delete</button></td>`;
                empT.appendChild(tr);
            } else if (u.role === 'Technician') {
                const tech = u; // password still present
                tr.innerHTML = `<td>${u.userid}</td><td>${u.name}</td><td>${u.password}</td><td>${tech.category||''}</td><td><button class="del" data-id="${u.userid}">Delete</button></td>`;
                techT.appendChild(tr);
            } else if (u.role === 'Admin') {
                // admins omitted from display
            }
        });
        document.querySelectorAll('#userTables .del').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.getAttribute('data-id');
                if (!confirm('Delete user '+id+'?')) return;
                const resp = await fetch('/api/auth/users/'+id, { method: 'DELETE', headers:{ Authorization: token }});
                if (resp.ok) loadUsers();
            });
        });
    }

    loadUsers();
    </script>
    <script src="js/common.js"></script>
</body>

</html>
