<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Technician Resolved Tickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
     <div class="header">
        <h1>OBL IT-PULSE</h1>
    </div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-toggle" id="toggleBtn">☰</div>
        <h2>Technician</h2>
        <a href="technician_dashboard.html">Home</a>
        <a href="technician_category.html?category=ERP">ERP</a>
        <a href="technician_category.html?category=Hardware">Hardware</a>
        <a href="technician_category.html?category=Network">Network</a>
        <a href="technician_category.html?category=Software">Software</a>
        <a href="technician_resolved.html" class="active">Resolved</a>
        <a href="technician_feedback.html">Feedbacks</a>
        <a href="#" id="logout">Logout</a>
    </div>
    <div class="main-content">
        <p id="greeting" style="font-size:1.2rem; margin-bottom:20px;"></p>
        <h1>My Resolved Tickets</h1>
        <table id="ticketTable">
            <thead><tr><th>ID</th><th>Category</th><th>Remark</th><th>Feedback</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="js/common.js"></script>
    <script>
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    if (!token || role !== 'Technician') {
        window.location.href = 'login.html';
    }

    async function loadResolved() {
        const userId = localStorage.getItem('userId');
        const res = await fetch('/api/tickets', { headers: { Authorization: token } });
        if (!res.ok) return;
        const tickets = await res.json();
        const fResp = await fetch('/api/feedback/tech', { headers: { Authorization: token } });
        const feedbacks = fResp.ok ? await fResp.json() : [];
        const tbody = document.querySelector('#ticketTable tbody');
        tickets.filter(t=>t.assigned_to===userId && t.status==='Resolved').forEach(t=>{
            const fb = feedbacks.find(f=>f.ticketid==t.ticketid);
            const tr=document.createElement('tr');
            tr.innerHTML = `<td>${t.ticketid}</td><td>${t.category}</td><td>${t.remark||''}</td><td>${fb?fb.rating+' ('+fb.comment+')':''}</td>`;
            tbody.appendChild(tr);
        });
    }
    loadResolved();
    const name = localStorage.getItem('name');
    const cat = localStorage.getItem('category');
    if (name) {
        document.getElementById('greeting').textContent = `Hello ${name} ${cat ? '('+cat+' Technician)' : ''}`;
    }    </script>
</body>
</html>
