<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Technician Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Technician Login</h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required />
                <input type="password" id="password" placeholder="Password" required />
                <button type="submit">Login</button>
            </form>
            <p id="error" class="error-message"></p>
        </div>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const userId = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, password }),
            });
            const data = await res.json();
            if (res.ok) {
                if (data.role === 'Technician') {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('userId', userId);
                    window.location.href = 'technician_dashboard.html';
                } else {
                    document.getElementById('error').textContent = 'Not a technician account';
                }
            } else {
                document.getElementById('error').textContent = data.message || 'Login failed';
            }
        } catch (err) {
            console.error(err);
            document.getElementById('error').textContent = 'Server error';
        }
    });
    </script>
</body>
</html>
