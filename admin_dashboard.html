<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />

</head>
<body>
     <div class="header">
        <h1>OBL IT-PULSE</h1>
    </div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-toggle" id="toggleBtn">☰</div>
        <a href="admin_dashboard.html">Dashboard</a>
        <a href="analytics.html">Analytics</a>

    <div class="main">
        <h1>Admin Panel</h1>
        <div class="cards">
            <div class="card">Total Tickets: <span id="total">0</span></div>
            <div class="card">Pending: <span id="pending">0</span></div>
            <div class="card">Resolved: <span id="resolved">0</span></div>
            <div class="card">Overdue: <span id="overdue">0</span></div>
        </div>
        <h2>Recent Tickets</h2>
        <table id="recentTable"><thead><tr><th>ID</th><th>Category</th><th>Status</th><th>Date</th></tr></thead><tbody></tbody></table>
        <h2>Technician workload</h2>
        <table id="workloadTable"><thead><tr><th>Technician</th><th>Active Tickets</th></tr></thead><tbody></tbody></table>
    </div>
